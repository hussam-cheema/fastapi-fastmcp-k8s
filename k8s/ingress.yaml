apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: reminders
  namespace: practice

spec:
  ingressClassName: nginx

  rules:
    - host: reminders.test

      http:
        paths:

          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000

          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000

          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000

          - path: /openapi.json
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000

          - path: /health
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000

          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
