apiVersion: apps/v1
kind: Deployment

metadata:
  name: api
  namespace: practice

spec:

  replicas: 3

  selector:
    matchLabels:
      app: api

  template:

    metadata:
      labels:
        app: api

    spec:

      containers:

        - name: api

          image: fastapi-mcp-demo:2.0

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          env:

            - name: MONGO_URL
              value: "mongodb://mongo-0.mongo:27017,mongo-1.mongo:27017,mongo-2.mongo:27017/?replicaSet=rs0"

          readinessProbe:

            httpGet:
              path: /health/ready
              port: 8000

            initialDelaySeconds: 3
            periodSeconds: 5


          livenessProbe:

            httpGet:
              path: /health/live
              port: 8000

            initialDelaySeconds: 5
            periodSeconds: 10


---
apiVersion: v1
kind: Service

metadata:
  name: api
  namespace: practice

spec:

  selector:
    app: api

  ports:

    - port: 8000
      targetPort: 8000

  type: ClusterIP
